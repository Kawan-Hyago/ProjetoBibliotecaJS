<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Leituras</title>
    <link rel="stylesheet" href="css/style.css">

    <script src="js/appLivro.js" defer></script>
    <script src="js/emprestimos.js" defer></script>
    <script src="js/appEmprestimo.js" defer></script>

</head>
<body>
    <header>
        <h1>Lista de Leituras</h1>
    </header>

    <main>
        <form id="formLivro">
            <input id="titulo" placeholder="Título" required>
            <input id="autor" placeholder="Autor" required>
            <input id="genero" placeholder="Gênero" required>
            <input id="paginas" type="number" placeholder="Páginas" required>
            <button type="submit">Cadastrar</button>
        </form>

        <input id="pesquisa" placeholder="Pesquisar por título...">

        <section id="estatisticas"></section>
        <section id="listaLivros"></section>

        <h2 class="titulo-secao">Empréstimos</h2>

        <form id="formEmprestimo">
            <select id="livroEmprestimo" required></select>
            <input id="amigo" placeholder="Nome do amigo" required>
            <input id="dataEmprestimo" type="date" required>
            <button type="submit">Registrar empréstimo</button>
        </form>

        <section id="listaEmprestimos"></section>
    </main>
</body>
</html>
